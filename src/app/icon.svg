<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 不動産PDF工房 favicon: indigo グラデの角丸背景に家のシルエット + PDF テキスト -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- 家のシルエット (上半分) -->
  <path d="M16 4 L26 12 L26 14 L24 14 L24 19 L18 19 L18 15 L14 15 L14 19 L8 19 L8 14 L6 14 L6 12 Z" fill="#ffffff"/>
  <!-- 下部に "PDF" テキスト風の白いバー (シンプルさ優先で文字ではなく abstract line) -->
  <rect x="7" y="22" width="18" height="2.5" rx="1.25" fill="#ffffff" opacity="0.95"/>
  <rect x="7" y="26" width="12" height="2.5" rx="1.25" fill="#ffffff" opacity="0.75"/>
</svg>
